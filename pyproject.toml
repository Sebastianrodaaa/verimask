[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verimask"
version = "0.1.0"
description = "Verifier-diagnosed remasking for diffusion LMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sebastian Roda" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
  "matplotlib>=3.8",
  "pillow>=10.0",
]
gpu = [
  "transformers>=4.44",
  "accelerate>=0.33",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verimask*", "baselines*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
